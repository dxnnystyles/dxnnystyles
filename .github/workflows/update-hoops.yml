name: Refresh Hoops contribution artwork

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      baseline_sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record the public profile baseline
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Render public dxnnystyles activity
        uses: HarrisJDCampbell/hoops@c90b483d3f7e61544afaee4c105a51d410346cb2
        with:
          github_user_name: dxnnystyles
          out_dir: ${{ runner.temp }}/hoops-generated
          jersey: '#c26037,#e7a875'
          pace: '0.25'
          order: newest-first
          footer: 'dxnnystyles · public contributions'

      - name: Prepare and validate the complete Hoops asset set
        run: |
          python3 scripts/prepare_hoops_assets.py \
            --generated-dir "$RUNNER_TEMP/hoops-generated" \
            --output-dir "$RUNNER_TEMP/hoops-publish-ready" \
            --panel-template assets/hoops/hoops-profile-dark-panel.svg

      - name: Upload this run's validated three-asset set
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: hoops-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/hoops-publish-ready/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    if: ${{ needs.generate.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Download only this run's validated artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4.3.0
        with:
          name: hoops-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/hoops-artifact
          digest-mismatch: error

      - name: Prepare one atomic three-asset commit without credentials
        id: prepare
        env:
          BASELINE_SHA: ${{ needs.generate.outputs.baseline_sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/hoops-artifact
          PUBLISH_DIR: ${{ runner.temp }}/hoops-publisher
        run: |
          set -euo pipefail
          git clone --no-tags --single-branch --branch main "https://github.com/$GITHUB_REPOSITORY.git" "$PUBLISH_DIR"
          cd "$PUBLISH_DIR"
          if [ "$(git rev-parse HEAD)" != "$BASELINE_SHA" ]; then
            echo "Profile main changed during generation; refusing stale publication." >&2
            exit 1
          fi
          python3 scripts/prepare_hoops_assets.py --validate-only --output-dir "$ARTIFACT_DIR"
          install -m 0644 "$ARTIFACT_DIR/hoops.svg" assets/hoops/hoops.svg
          install -m 0644 "$ARTIFACT_DIR/hoops-dark.svg" assets/hoops/hoops-dark.svg
          install -m 0644 "$ARTIFACT_DIR/hoops-profile-dark-panel.svg" assets/hoops/hoops-profile-dark-panel.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hoops/hoops.svg assets/hoops/hoops-dark.svg assets/hoops/hoops-profile-dark-panel.svg
          while IFS= read -r path; do
            case "$path" in
              assets/hoops/hoops.svg|assets/hoops/hoops-dark.svg|assets/hoops/hoops-profile-dark-panel.svg) ;;
              *) echo "Unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh Hoops contribution artwork"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push the prepared Hoops commit
        if: steps.prepare.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/hoops-publisher
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s' "$GITHUB_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git push "https://github.com/$GITHUB_REPOSITORY.git" HEAD:main
