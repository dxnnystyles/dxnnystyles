<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="360" height="178" viewBox="0 0 360 178"><title id="title">Primary languages in five original public dxnnystyles repositories</title><desc id="desc">Snapshot 2026-10-26 UTC. JavaScript is the GitHub primary language for two repositories; HTML for two; one repository has no primary-language label. Counts are repositories, not code volume.</desc><rect x="1" y="1" width="358" height="176" rx="9" fill="#161b22" stroke="#30363d"/><text x="18" y="31" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Repository languages</text><text x="18" y="52" font-family="Arial,sans-serif" font-size="11" fill="#8b949e">Primary language · original public repos · 2026-10-26 UTC</text><g font-family="Arial,sans-serif" font-size="12" fill="#e6edf3"><text x="18" y="85">JavaScript</text><rect x="116" y="72" width="170" height="18" rx="3" fill="#30363d"/><rect x="116" y="72" width="170" height="18" rx="3" fill="#f1e05a"/><text x="304" y="85">2</text><text x="18" y="121">HTML</text><rect x="116" y="108" width="170" height="18" rx="3" fill="#30363d"/><rect x="116" y="108" width="170" height="18" rx="3" fill="#e34c26"/><text x="304" y="121">2</text></g><text x="18" y="158" font-family="Arial,sans-serif" font-size="10" fill="#8b949e">1 repo has no language label · counted by repo, not code volume</text></svg>